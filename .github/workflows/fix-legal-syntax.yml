name: Fix legal page syntax

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-legal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert every legal body string to double quotes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/legal/[slug]/page.tsx')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          out = []
          changed = False

          # Every body value in this file is a single-line string. Convert
          # body:'...' to body:"..." so apostrophes cannot terminate it.
          pattern = re.compile(r"body:'(.*)'([,}])(?=\s*$)")

          for line in lines:
              match = pattern.search(line)
              if not match:
                  out.append(line)
                  continue

              body = match.group(1)
              terminator = match.group(2)
              # Escape any literal double quotes before switching delimiters.
              body = body.replace('\\"', '"').replace('"', '\\"')
              replacement = f'body:"{body}"{terminator}'
              line = line[:match.start()] + replacement + line[match.end():]
              changed = True
              out.append(line)

          new_text = ''.join(out)
          if changed:
              path.write_text(new_text, encoding='utf-8')
          else:
              print('No single-quoted body values remain to convert.')
          PY

      - name: Verify no single-quoted body values remain
        run: |
          if grep -nE "body:'" app/legal/'[slug]'/page.tsx; then
            echo "ERROR: A single-quoted body value remains."
            exit 1
          fi
          echo "All legal body values use double quotes."

      - name: Commit and push
        run: |
          if git diff --quiet -- app/legal/'[slug]'/page.tsx; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/legal/'[slug]'/page.tsx
          git commit -m "Convert all legal body strings to double quotes"
          git push
