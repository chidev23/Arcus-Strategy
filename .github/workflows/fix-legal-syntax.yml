name: Fix legal page syntax

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-legal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert all legal body strings safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/legal/[slug]/page.tsx')
          text = path.read_text(encoding='utf-8')

          # Each legal body is a single-line value ending immediately before
          # the comma/closing brace. Capture the complete value greedily so
          # apostrophes such as strategy's, user's, don't, etc. are preserved.
          pattern = re.compile(r"body:'(.*)'(?=,\s*$)", re.MULTILINE)

          def convert(match):
              body = match.group(1)
              # Convert the delimiter to double quotes and escape literal
              # double quotes that may already occur in the legal text.
              body = body.replace('\\"', '"').replace('"', '\\"')
              return 'body:"' + body + '"'

          new_text, count = pattern.subn(convert, text)
          print(f'Converted {count} single-quoted body values.')
          path.write_text(new_text, encoding='utf-8')
          PY

      - name: Verify legal body strings
        run: |
          if grep -nE "body:'" app/legal/'[slug]'/page.tsx; then
            echo "ERROR: single-quoted legal body values remain."
            exit 1
          fi
          echo "PASS: all legal body values use double quotes."

      - name: Install dependencies
        run: npm ci

      - name: Run production build before committing
        run: npm run build

      - name: Commit and push verified fix
        run: |
          if git diff --quiet -- app/legal/'[slug]'/page.tsx; then
            echo "No legal source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/legal/'[slug]'/page.tsx
          git commit -m "Fix legal page string syntax"
          git push
